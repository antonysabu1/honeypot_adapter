services:
  honeypot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: honeypot

    restart: unless-stopped

    environment:
      HONEYPOT_SSH_ADAPTER: asyncssh
      PYTHONUNBUFFERED: "1"

    ports:
      - "2222:2222"
      - "2323:2323"

    volumes:
      - honeypot-data:/app/new/logs

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    mem_limit: 512m
    cpus: "1.0"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',2222)); s.close()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:  honeypot-data:

